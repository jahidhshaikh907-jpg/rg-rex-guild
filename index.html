<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG REX - Guild Notebook</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Georgia,serif;
    background:#17120d;
    color:#30251b;
    min-height:100vh;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:50;
    background:#21180f;
    color:#f4d7a1;
    padding:14px 100px 14px 15px;
    text-align:center;
    border-bottom:3px solid #9b6b32;
}

header h1{
    font-size:27px;
    letter-spacing:3px;
}

header p{
    margin-top:4px;
    color:#c8a978;
}

#adminBtn{
    position:absolute;
    right:10px;
    top:12px;
    border:0;
    border-radius:7px;
    padding:9px 12px;
    background:#9b6b32;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#adminBtn:hover{
    background:#c28b45;
}

/* NAVIGATION */
nav{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:7px;
    padding:10px;
    background:#2b2015;
}

button{
    border:0;
    border-radius:7px;
    padding:10px 14px;
    background:#9b6b32;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#c28b45;
}

/* NOTEBOOK */
.book{
    width:95%;
    max-width:1100px;
    margin:24px auto;
    display:flex;
    background:#4b2d18;
    padding:12px;
    border-radius:10px;
    box-shadow:0 10px 30px #000;
}

.spine{
    width:48px;
    background:#39210f;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    align-items:center;
    padding:15px 0;
    border-radius:8px 0 0 8px;
}

.ring{
    width:25px;
    height:25px;
    border:5px solid #aaa;
    border-radius:50%;
}

.page{
    flex:1;
    padding:25px;
    min-height:650px;
    background:
        repeating-linear-gradient(
            to bottom,
            #f4e6c8 0,
            #f4e6c8 31px,
            #d9c8a5 32px
        );
    border-radius:0 8px 8px 0;
}

/* SECTIONS */
.section{
    display:none;
}

.section.active{
    display:block;
}

h2{
    font-size:30px;
    margin-bottom:18px;
}

.back{
    margin-bottom:18px;
    background:#6f4a25;
}

/* EDITOR */
.editor{
    display:none;
    background:#fff1d0;
    border:2px solid #9c723f;
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
}

body.admin .editor{
    display:block;
}

.editor h3{
    margin-bottom:10px;
}

.editor input,
.editor textarea,
.editor select{
    width:100%;
    padding:10px;
    margin:5px 0;
    border:1px solid #aa895f;
    border-radius:6px;
    font-family:inherit;
}

.editor textarea{
    min-height:100px;
}

.editor label{
    display:block;
    margin-top:8px;
    font-weight:bold;
}

/* HOME */
.cover{
    text-align:center;
    padding:15px;
}

.cover img{
    width:100%;
    max-width:600px;
    height:300px;
    object-fit:cover;
    border:7px solid #6b431f;
    border-radius:12px;
    box-shadow:0 8px 20px #5b4630;
}

.cover h2{
    font-size:42px;
    margin-top:22px;
}

.cover p{
    font-size:18px;
    margin-bottom:20px;
}

.actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
}

/* CARDS */
.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(210px,1fr));
    gap:15px;
}

.card,
.gvg{
    background:#fff3d6;
    border:2px solid #b58b55;
    border-radius:10px;
    padding:14px;
    box-shadow:0 4px 10px #8e7657;
}

.member-img{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:8px;
    margin-bottom:8px;
}

.delete{
    background:#a63d32;
    margin-top:10px;
}

/* NOTES */
.note{
    width:100%;
    min-height:350px;
    padding:15px;
    font:17px Georgia,serif;
    background:#fff9e8;
    border:2px solid #b58b55;
    border-radius:10px;
    resize:vertical;
}

/* GVG */
.badge{
    display:inline-block;
    color:white;
    padding:5px 9px;
    border-radius:5px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:8px;
}

.WIN{
    background:#3d8b40;
}

.LOSS{
    background:#b43d35;
}

.UPCOMING{
    background:#777;
}

/* GALLERY */
.gallery{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(190px,1fr));
    gap:14px;
}

.photoBox img{
    width:100%;
    height:200px;
    object-fit:cover;
    border:4px solid #8c6738;
    border-radius:10px;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#000c;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal img{
    max-width:94%;
    max-height:85%;
    border:5px solid white;
    border-radius:8px;
}

.close{
    position:absolute;
    right:20px;
    top:10px;
    color:white;
    font-size:40px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){

    header{
        padding-right:95px;
    }

    header h1{
        font-size:20px;
    }

    header p{
        font-size:12px;
    }

    #adminBtn{
        right:7px;
        top:11px;
        padding:8px 9px;
        font-size:11px;
    }

    .book{
        width:97%;
        padding:6px;
    }

    .spine{
        width:28px;
    }

    .ring{
        width:18px;
        height:18px;
        border-width:3px;
    }

    .page{
        padding:17px;
    }

    .cover img{
        height:220px;
    }

    .cover h2{
        font-size:30px;
    }

    nav button{
        padding:8px 10px;
        font-size:12px;
    }
}
</style>
</head>

<body>

<header>

    <h1 id="siteName">RG REX</h1>

    <p id="siteSubtitle">
        Guild Notebook
    </p>

    <button id="adminBtn" type="button">
        ✏️ EDIT
    </button>

</header>


<nav>

    <button type="button" onclick="showPage('home')">
        HOME
    </button>

    <button type="button" onclick="showPage('members')">
        MEMBERS
    </button>

    <button type="button" onclick="showPage('notes')">
        NOTES
    </button>

    <button type="button" onclick="showPage('gvg')">
        GVG
    </button>

    <button type="button" onclick="showPage('gallery')">
        GALLERY
    </button>

</nav>


<div class="book">

    <div class="spine">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>


    <div class="page">


        <!-- HOME -->
        <section id="home" class="section active">

            <div class="editor">

                <h3>✏️ Edit Home</h3>

                <input
                    id="editName"
                    type="text"
                    placeholder="Guild Name"
                >

                <input
                    id="editSubtitle"
                    type="text"
                    placeholder="Subtitle"
                >

                <input
                    id="editTitle"
                    type="text"
                    placeholder="Home Title"
                >

                <textarea
                    id="editDescription"
                    placeholder="Description"
                ></textarea>

                <label>
                    📷 Change Cover Photo
                </label>

                <input
                    id="coverInput"
                    type="file"
                    accept="image/*"
                >

                <button
                    type="button"
                    onclick="saveHome()"
                >
                    SAVE HOME
                </button>

            </div>


            <div class="cover">

                <img
                    id="coverImage"
                    src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80"
                    alt="Guild Cover"
                >

                <h2 id="coverTitle">
                    GUILD BOOK
                </h2>

                <p id="coverDescription">
                    Welcome to the official RG REX Guild Notebook.
                </p>

                <div class="actions">

                    <button onclick="showPage('members')">
                        MEMBERS
                    </button>

                    <button onclick="showPage('notes')">
                        NOTES
                    </button>

                    <button onclick="showPage('gvg')">
                        GVG
                    </button>

                    <button onclick="showPage('gallery')">
                        GALLERY
                    </button>

                </div>

            </div>

        </section>


        <!-- MEMBERS -->
        <section id="members" class="section">

            <button
                class="back"
                type="button"
                onclick="showPage('home')"
            >
                ← BACK
            </button>


            <div class="editor">

                <h3>➕ Add Member</h3>

                <input
                    id="memberName"
                    type="text"
                    placeholder="Member Name"
                >

                <input
                    id="memberRole"
                    type="text"
                    placeholder="Member Role"
                >

                <label>
                    📷 Member Photo
                </label>

                <input
                    id="memberInput"
                    type="file"
                    accept="image/*"
                >

                <button
                    type="button"
                    onclick="addMember()"
                >
                    ADD MEMBER
                </button>

            </div>


            <h2>Guild Members</h2>

            <div
                id="memberList"
                class="grid"
            ></div>

        </section>


        <!-- NOTES -->
        <section id="notes" class="section">

            <button
                class="back"
                type="button"
                onclick="showPage('home')"
            >
                ← BACK
            </button>

            <h2>Guild Notes</h2>

            <textarea
                id="notesBox"
                class="note"
                placeholder="Click EDIT to write notes..."
                readonly
            ></textarea>

            <p>
                Notes are saved automatically.
            </p>

        </section>


        <!-- GVG -->
        <section id="gvg" class="section">

            <button
                class="back"
                type="button"
                onclick="showPage('home')"
            >
                ← BACK
            </button>


            <div class="editor">

                <h3>⚔️ Add GVG</h3>

                <input
                    id="enemyGuild"
                    type="text"
                    placeholder="Enemy Guild"
                >

                <input
                    id="gvgDate"
                    type="date"
                >

                <input
                    id="gvgTime"
                    type="time"
                >

                <input
                    id="gvgScore"
                    type="text"
                    placeholder="Score e.g. 10 - 8"
                >

                <select id="gvgResult">

                    <option value="UPCOMING">
                        UPCOMING
                    </option>

                    <option value="WIN">
                        WIN
                    </option>

                    <option value="LOSS">
                        LOSS
                    </option>

                </select>

                <button
                    type="button"
                    onclick="addGVG()"
                >
                    ADD GVG
                </button>

            </div>


            <h2>GVG Battles</h2>

            <div id="gvgList"></div>

        </section>


        <!-- GALLERY -->
        <section id="gallery" class="section">

            <button
                class="back"
                type="button"
                onclick="showPage('home')"
            >
                ← BACK
            </button>


            <div class="editor">

                <h3>📷 Add Photo</h3>

                <input
                    id="galleryInput"
                    type="file"
                    accept="image/*"
                >

                <button
                    type="button"
                    onclick="addGalleryPhoto()"
                >
                    ADD PHOTO
                </button>

            </div>


            <h2>Guild Gallery</h2>

            <div
                id="galleryList"
                class="gallery"
            ></div>

        </section>

    </div>

</div>


<!-- IMAGE MODAL -->
<div
    id="imageModal"
    class="modal"
>

    <span
        id="closeModal"
        class="close"
    >
        ×
    </span>

    <img id="modalImage" alt="Gallery Image">

</div>


<script>

/* =====================================================
   DATA
===================================================== */

const defaultData = {

    name: "RG REX",

    subtitle: "Guild Notebook",

    title: "GUILD BOOK",

    description:
        "Welcome to the official RG REX Guild Notebook.",

    cover:
        "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1200&q=80",

    notes: "",

    members: [
        {
            name: "Monster",
            role: "Guild Leader",
            image: ""
        },
        {
            name: "Bhai Jaan",
            role: "Officer",
            image: ""
        },
        {
            name: "Swag",
            role: "Member",
            image: ""
        }
    ],

    gvg: [],

    gallery: []

};


/* =====================================================
   LOAD DATA
===================================================== */

let data = JSON.parse(JSON.stringify(defaultData));
let firebaseReady = false;

function normalizeData(value){

    if(!value){
        return JSON.parse(JSON.stringify(defaultData));
    }

    value.members = Array.isArray(value.members)
        ? value.members
        : [];

    value.gvg = Array.isArray(value.gvg)
        ? value.gvg
        : [];

    value.gallery = Array.isArray(value.gallery)
        ? value.gallery
        : [];

    return value;
}


/* =====================================================
   ADMIN MODE
===================================================== */

let adminMode = false;


/* =====================================================
   ELEMENTS
===================================================== */

const adminBtn =
    document.getElementById("adminBtn");

const siteName =
    document.getElementById("siteName");

const siteSubtitle =
    document.getElementById("siteSubtitle");

const coverImage =
    document.getElementById("coverImage");

const coverTitle =
    document.getElementById("coverTitle");

const coverDescription =
    document.getElementById("coverDescription");

const editName =
    document.getElementById("editName");

const editSubtitle =
    document.getElementById("editSubtitle");

const editTitle =
    document.getElementById("editTitle");

const editDescription =
    document.getElementById("editDescription");

const coverInput =
    document.getElementById("coverInput");

const notesBox =
    document.getElementById("notesBox");

const memberName =
    document.getElementById("memberName");

const memberRole =
    document.getElementById("memberRole");

const memberInput =
    document.getElementById("memberInput");

const memberList =
    document.getElementById("memberList");

const enemyGuild =
    document.getElementById("enemyGuild");

const gvgDate =
    document.getElementById("gvgDate");

const gvgTime =
    document.getElementById("gvgTime");

const gvgScore =
    document.getElementById("gvgScore");

const gvgResult =
    document.getElementById("gvgResult");

const gvgList =
    document.getElementById("gvgList");

const galleryInput =
    document.getElementById("galleryInput");

const galleryList =
    document.getElementById("galleryList");

const imageModal =
    document.getElementById("imageModal");

const modalImage =
    document.getElementById("modalImage");

const closeModal =
    document.getElementById("closeModal");


/* =====================================================
   SAVE DATA
===================================================== */

function saveData(){

    if(!auth.currentUser || auth.currentUser.uid !== ADMIN_UID){
        alert("🔐 Admin login required.");
        return;
    }

    dbRef.set(data)
        .then(function(){
            console.log("✅ Data saved to Firebase");
        })
        .catch(function(error){
            console.error("Firebase save error:", error);
            alert("❌ Data save nahi hua.");
        });
}

/* =====================================================
   ADMIN BUTTON
===================================================== */
   adminBtn.addEventListener("click", function(){

    if(adminMode){
        adminMode = false;

        document.body.classList.remove("admin");
        adminBtn.textContent = "✏️ EDIT";
        notesBox.readOnly = true;

        renderMembers();
        renderGVG();
        renderGallery();

        auth.signOut();
        return;
    }

    const email = prompt("📧 Enter Admin Email:");
    if(email === null) return;

    const password = prompt("🔐 Enter Firebase Password:");
    if(password === null) return;

    auth.signInWithEmailAndPassword(
        email.trim(),
        password
    )
    .then(function(userCredential){

        if(userCredential.user.uid !== ADMIN_UID){
            alert("❌ This account is not the admin.");
            auth.signOut();
            return;
        }

        adminMode = true;

        document.body.classList.add("admin");
        adminBtn.textContent = "🔒 LOCK";
        notesBox.readOnly = false;

        loadEditorValues();
        renderMembers();
        renderGVG();
        renderGallery();

        alert("✅ Admin Mode ON");

    })
    .catch(function(error){

        console.error("Firebase Login Error:", error);
        alert("❌ Login failed.\nEmail ya password check karo.");

    });

});
            


/* =====================================================
   NAVIGATION
===================================================== */

function showPage(page){

    document
        .querySelectorAll(".section")
        .forEach(
            function(section){

                section.classList.remove("active");

            }
        );


    const target =
        document.getElementById(page);

    if(target){

        target.classList.add("active");

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   HOME
===================================================== */

function renderHome(){

    siteName.textContent =
        data.name;

    siteSubtitle.textContent =
        data.subtitle;

    coverTitle.textContent =
        data.title;

    coverDescription.textContent =
        data.description;

    coverImage.src =
        data.cover;

}


function loadEditorValues(){

    editName.value =
        data.name;

    editSubtitle.value =
        data.subtitle;

    editTitle.value =
        data.title;

    editDescription.value =
        data.description;

}


function saveHome(){

    if(!adminMode){

        return;

    }

    data.name =
        editName.value.trim() ||
        "RG REX";

    data.subtitle =
        editSubtitle.value.trim() ||
        "Guild Notebook";

    data.title =
        editTitle.value.trim() ||
        "GUILD BOOK";

    data.description =
        editDescription.value.trim();

    saveData();

    renderHome();

}


/* =====================================================
   COVER IMAGE
===================================================== */

coverInput.addEventListener(
    "change",
    function(){

        if(!adminMode){
            return;
        }

        const file =
            coverInput.files[0];

        if(!file){
            return;
        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                data.cover =
                    event.target.result;

                saveData();

                renderHome();

            };

        reader.readAsDataURL(file);

    }
);


/* =====================================================
   MEMBERS
===================================================== */

function renderMembers(){

    memberList.innerHTML = "";

    data.members.forEach(
        function(member,index){

            const card =
                document.createElement("div");

            card.className =
                "card";


            let photo = "";

            if(member.image){

                photo =
                    `
                    <img
                        class="member-img"
                        src="${member.image}"
                        alt="Member Photo"
                    >
                    `;

            }


            let editArea = "";

            if(adminMode){

                editArea = `

                    <div class="editor">

                        <input
                            value="${escapeAttribute(member.name)}"
                            onchange="editMemberName(${index},this.value)"
                        >

                        <input
                            value="${escapeAttribute(member.role)}"
                            onchange="editMemberRole(${index},this.value)"
                        >

                        <input
                            type="file"
                            accept="image/*"
                            onchange="changeMemberImage(${index},this)"
                        >

                    </div>

                    <button
                        class="delete"
                        type="button"
                        onclick="deleteMember(${index})"
                    >
                        DELETE
                    </button>

                `;

            }


            card.innerHTML = `

                ${photo}

                <h3>
                    ${escapeHTML(member.name)}
                </h3>

                <p>
                    ${escapeHTML(member.role)}
                </p>

                ${editArea}

            `;


            memberList.appendChild(card);

        }
    );

}


function addMember(){

    if(!adminMode){
        return;
    }

    const name =
        memberName.value.trim();

    const role =
        memberRole.value.trim() ||
        "Member";

    const file =
        memberInput.files[0];


    if(!name){

        alert(
            "Enter member name."
        );

        return;

    }


    if(file){

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                data.members.push({

                    name:name,

                    role:role,

                    image:event.target.result

                });

                saveData();

                renderMembers();

            };

        reader.readAsDataURL(file);

    }else{

        data.members.push({

            name:name,

            role:role,

            image:""

        });

        saveData();

        renderMembers();

    }


    memberName.value = "";

    memberRole.value = "";

    memberInput.value = "";

}


function editMemberName(index,value){

    if(!adminMode){
        return;
    }

    data.members[index].name =
        value.trim();

    saveData();

    renderMembers();

}


function editMemberRole(index,value){

    if(!adminMode){
        return;
    }

    data.members[index].role =
        value.trim();

    saveData();

    renderMembers();

}


function changeMemberImage(index,input){

    if(!adminMode){
        return;
    }

    const file =
        input.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(event){

            data.members[index].image =
                event.target.result;

            saveData();

            renderMembers();

        };

    reader.readAsDataURL(file);

}


function deleteMember(index){

    if(!adminMode){
        return;
    }

    if(
        confirm(
            "Delete this member?"
        )
    ){

        data.members.splice(
            index,
            1
        );

        saveData();

        renderMembers();

    }

}


/* =====================================================
   NOTES
===================================================== */

notesBox.value =
    data.notes || "";


notesBox.addEventListener(
    "input",
    function(){

        if(!adminMode){
            return;
        }

        data.notes =
            notesBox.value;

        saveData();

    }
);


/* =====================================================
   GVG
===================================================== */

function renderGVG(){

    gvgList.innerHTML = "";


    if(data.gvg.length === 0){

        gvgList.innerHTML =
            "<p>No GVG records yet.</p>";

        return;

    }


    data.gvg.forEach(
        function(match,index){

            const box =
                document.createElement("div");

            box.className =
                "gvg";


            let editArea = "";

            if(adminMode){

                editArea = `

                    <div class="editor">

                        <input
                            value="${escapeAttribute(match.enemy)}"
                            onchange="editGVG(${index},'enemy',this.value)"
                        >

                        <input
                            type="date"
                            value="${escapeAttribute(match.date)}"
                            onchange="editGVG(${index},'date',this.value)"
                        >

                        <input
                            type="time"
                            value="${escapeAttribute(match.time)}"
                            onchange="editGVG(${index},'time',this.value)"
                        >

                        <input
                            value="${escapeAttribute(match.score)}"
                            onchange="editGVG(${index},'score',this.value)"
                        >

                        <select
                            onchange="editGVG(${index},'result',this.value)"
                        >

                            <option value="UPCOMING"
                                ${match.result==="UPCOMING" ? "selected" : ""}>
                                UPCOMING
                            </option>

                            <option value="WIN"
                                ${match.result==="WIN" ? "selected" : ""}>
                                WIN
                            </option>

                            <option value="LOSS"
                                ${match.result==="LOSS" ? "selected" : ""}>
                                LOSS
                            </option>

                        </select>

                    </div>

                    <button
                        class="delete"
                        type="button"
                        onclick="deleteGVG(${index})"
                    >
                        DELETE
                    </button>

                `;

            }


            box.innerHTML = `

                <span class="badge ${escapeHTML(match.result)}">
                    ${escapeHTML(match.result)}
                </span>

                <h3>
                    RG REX vs
                    ${escapeHTML(match.enemy)}
                </h3>

                <p>
                    Date:
                    ${escapeHTML(match.date || "Not set")}
                </p>

                <p>
                    Time:
                    ${escapeHTML(match.time || "Not set")}
                </p>

                <p>
                    Score:
                    ${escapeHTML(match.score || "Not set")}
                </p>

                ${editArea}

            `;


            gvgList.appendChild(box);

        }
    );

}


function addGVG(){

    if(!adminMode){
        return;
    }

    const enemy =
        enemyGuild.value.trim();

    if(!enemy){

        alert(
            "Enter enemy guild name."
        );

        return;

    }


    data.gvg.unshift({

        enemy:enemy,

        date:gvgDate.value,

        time:gvgTime.value,

        score:gvgScore.value.trim(),

        result:gvgResult.value

    });


    saveData();

    renderGVG();


    enemyGuild.value = "";

    gvgDate.value = "";

    gvgTime.value = "";

    gvgScore.value = "";

}


function editGVG(index,key,value){

    if(!adminMode){
        return;
    }

    data.gvg[index][key] =
        value;

    saveData();

    renderGVG();

}


function deleteGVG(index){

    if(!adminMode){
        return;
    }

    if(
        confirm(
            "Delete this GVG?"
        )
    ){

        data.gvg.splice(
            index,
            1
        );

        saveData();

        renderGVG();

    }

}


/* =====================================================
   GALLERY
===================================================== */

function renderGallery(){

    galleryList.innerHTML = "";


    if(data.gallery.length === 0){

        galleryList.innerHTML =
            "<p>No photos yet.</p>";

        return;

    }


    data.gallery.forEach(
        function(photo,index){

            const box =
                document.createElement("div");

            box.className =
                "photoBox";


            box.innerHTML = `

                <img
                    src="${photo}"
                    alt="Guild Photo"
                    onclick="openModal(this.src)"
                >

                ${
                    adminMode
                    ?
                    `
                    <button
                        class="delete"
                        type="button"
                        onclick="deleteGalleryPhoto(${index})"
                    >
                        DELETE
                    </button>
                    `
                    :
                    ""
                }

            `;


            galleryList.appendChild(box);

        }
    );

}


function addGalleryPhoto(){

    if(!adminMode){
        return;
    }

    const file =
        galleryInput.files[0];

    if(!file){

        alert(
            "Select a photo first."
        );

        return;

    }


    const reader =
        new FileReader();

    reader.onload =
        function(event){

            data.gallery.push(
                event.target.result
            );

            saveData();

            renderGallery();

            galleryInput.value = "";

        };


    reader.readAsDataURL(file);

}


function deleteGalleryPhoto(index){

    if(!adminMode){
        return;
    }

    if(
        confirm(
            "Delete this photo?"
        )
    ){

        data.gallery.splice(
            index,
            1
        );

        saveData();

        renderGallery();

    }

}


/* =====================================================
   IMAGE MODAL
===================================================== */

function openModal(src){

    modalImage.src =
        src;

    imageModal.style.display =
        "flex";

}


function closeImageModal(){

    imageModal.style.display =
        "none";

}


closeModal.addEventListener(
    "click",
    closeImageModal
);


imageModal.addEventListener(
    "click",
    function(event){

        if(
            event.target === imageModal
        ){

            closeImageModal();

        }

    }
);


document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeImageModal();

        }

    }
);


/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =====================================================
   INITIALIZE
===================================================== */

dbRef.on("value", function(snapshot){

    const remoteData = snapshot.val();

    data = normalizeData(remoteData);

    firebaseReady = true;

    renderHome();
    renderMembers();
    renderGVG();
    renderGallery();

    notesBox.value = data.notes || "";

    if(adminMode){
        loadEditorValues();
    }

    console.log("✅ Firebase data loaded/synced");

}, function(error){

    console.error("Firebase read error:", error);

    alert("❌ Firebase data load nahi hua.");

});

</script>
